# Quarkus Roq Configuration for Next Presso Blog

# Site Information
quarkus.roq.site.title=Next Presso
quarkus.roq.site.description=CDI, Java EE and friends

# URL Configuration - CRITICAL: WordPress-compatible URL format for SEO preservation
# Current Awestruct uses: /YYYY/MM/DD/post-slug/
# Roq uses date-based permalinks by default
quarkus.roq.site.url=http://localhost:8080
%prod.quarkus.roq.site.url=http://www.next-presso.com

# Blog Configuration
quarkus.roq.blog.posts-per-page=5

# AsciiDoc Configuration (matching Awestruct settings)
quarkus.roq.asciidoc.safe-mode=unsafe
quarkus.roq.asciidoc.attributes.icons=font
quarkus.roq.asciidoc.attributes.source-highlighter=highlightjs
quarkus.roq.asciidoc.attributes.source-language=java
quarkus.roq.asciidoc.attributes.sectanchors=
quarkus.roq.asciidoc.attributes.linkattrs=
quarkus.roq.asciidoc.attributes.compat-mode=@
quarkus.roq.asciidoc.attributes.attribute-missing=warn
quarkus.roq.asciidoc.attributes.idprefix=
quarkus.roq.asciidoc.attributes.idseparator=-

# Site Features
quarkus.roq.site.google-analytics-id=UA-5919317-1
quarkus.roq.site.disqus-shortname=nextpresso
quarkus.roq.site.twitter-widget-id=666631820319019009
quarkus.roq.site.twitter-handle=@antoine_sd

# RSS/Atom Feed Configuration
quarkus.roq.feed.path=/news.atom
quarkus.roq.feed.entries=20

# GitHub Pages Configuration
quarkus.roq.github.pages.enabled=true
quarkus.roq.github.pages.cname=www.next-presso.com

# Development Profile
%dev.quarkus.roq.site.url=http://localhost:8080
%dev.quarkus.roq.site.disqus-developer=true
%dev.quarkus.log.level=INFO

# Production Profile
%prod.quarkus.roq.site.url=http://www.next-presso.com
%prod.quarkus.roq.site.minify=true
