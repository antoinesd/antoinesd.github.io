<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{#if page.title && page.title != site.title}{page.title} | {site.title}{#else}{site.title} | {site.description}{/if}</title>
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="stylesheet" href="/static/css/asciidoctor.css">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.3.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/9.9.0/styles/github.min.css">
    <script type="text/javascript" src="//cdnjs.cloudflare.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
    <script type="text/javascript" src="//maxcdn.bootstrapcdn.com/bootstrap/3.3.2/js/bootstrap.min.js"></script>
    <script type="text/javascript" src="//cdnjs.cloudflare.com/ajax/libs/highlight.js/9.9.0/highlight.min.js"></script>
    <!--[if lt IE 9]>
    <script type="text/javascript" src="//html5shim.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->
    <script>
        hljs.initHighlightingOnLoad();
    </script>
    {#if site.google-analytics-id}
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={site.google-analytics-id}"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', '{site.google-analytics-id}');
    </script>
    {/if}
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="bannerhome">
                    <div class="container">
                        <div class="row">
                            <div class="col-lg-12 maintitle">
                                <h1>Next Presso (CDI, Java EE and friends)</h1>
                            </div>
                        </div>
                    </div>
                </div>
                <nav class="navbar navbar-default navbar-static-top" role="navigation">
                    <div class="container-fluid">
                        <div class="navbar-header">
                            <button class="navbar-toggle collapsed" type="button" data-toggle="collapse" data-target=".navbar-collapse">
                                <span class="sr-only">Toggle navigation</span>
                                <span class="icon-bar"></span>
                                <span class="icon-bar"></span>
                                <span class="icon-bar"></span>
                            </button>
                            <a class="navbar-brand" href="{site.url}">
                                <i class="fa fa-home fa-fw"></i> Home
                            </a>
                            <a class="navbar-brand" href="/about">
                                <i class="fa fa-user fa-fw"></i> About me
                            </a>
                        </div>
                    </div>
                </nav>
                <script>
                    var indexOfSharp = window.location.pathname.indexOf('#');
                    var pathname = indexOfSharp > 0 ? window.location.pathname.substring(0, indexOfSharp) : window.location.pathname;
                    var selector = "body > .container > .row > .col-md-12 > .navbar > .container-fluid > .navbar-collapse a[href='{site.url}" + pathname + "']";
                    $(selector).closest("li").addClass("active");
                </script>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-12">
                {#insert body/}
            </div>
        </div>
    </div>
    <hr>
    <footer>
    </footer>
</body>
</html>
