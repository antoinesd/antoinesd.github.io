name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Build with Maven (compile only)
        run: mvn clean compile -DskipTests
      
      - name: Build Quarkus Roq static site
        run: |
          echo "Starting Quarkus Roq site generation..."
          
          # Start Quarkus in dev mode to generate the static site
          timeout 180 mvn quarkus:dev \
            -Dquarkus.roq.site.url=https://www.next-presso.com \
            -Dquarkus.analytics.disabled=true &
          DEV_PID=$!
          
          # Wait for startup
          echo "Waiting for Quarkus to start..."
          sleep 45
          
          # Verify server is running
          MAX_RETRIES=10
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -f http://localhost:8080/ > /dev/null 2>&1; then
              echo "✓ Quarkus dev server is responding"
              break
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Retry $RETRY_COUNT/$MAX_RETRIES..."
            sleep 5
          done
          
          # Allow time for all pages to generate
          echo "Generating all pages..."
          sleep 60
          
          # Crawl the site to ensure all pages are generated
          echo "Crawling site to trigger page generation..."
          curl -s http://localhost:8080/ > /dev/null || true
          curl -s http://localhost:8080/about > /dev/null || true
          
          # Stop the dev server
          echo "Stopping Quarkus dev server..."
          kill $DEV_PID || true
          wait $DEV_PID 2>/dev/null || true
          
          echo "Site generation completed!"
      
      - name: Prepare deployment directory
        run: |
          echo "Preparing static site for deployment..."
          
          # Create deployment directory
          mkdir -p _site
          
          # Copy static resources
          if [ -d "src/main/resources/static" ]; then
            echo "Copying static resources..."
            cp -r src/main/resources/static/* _site/ 2>/dev/null || true
          fi
          
          # Copy generated content if available
          if [ -d "target/roq" ]; then
            echo "Copying generated Roq site..."
            cp -r target/roq/* _site/ 2>/dev/null || true
          fi
          
          # Ensure CNAME is present
          if [ -f "src/main/resources/static/CNAME" ]; then
            cp src/main/resources/static/CNAME _site/
          fi
          
          # Create a basic index.html if nothing was generated
          if [ ! -f "_site/index.html" ]; then
            echo "Creating placeholder index.html..."
            cat > _site/index.html << 'EOF'
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Next Presso - Under Construction</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 800px;
            margin: 100px auto;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #333; }
        p { color: #666; line-height: 1.6; }
    </style>
</head>
<body>
    <h1>Next Presso</h1>
    <p>CDI, Java EE and friends</p>
    <p>The site is currently being migrated to Quarkus Roq. Please check back soon!</p>
</body>
</html>
EOF
          fi
          
          echo "Deployment directory prepared:"
          ls -la _site/
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
  
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
