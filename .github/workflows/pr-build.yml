name: PR Build and Test

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Build with Maven (compile only)
        run: mvn clean compile -DskipTests
      
      - name: Build Quarkus Roq site
        run: |
          # Use Quarkus dev mode to generate static site
          timeout 120 mvn quarkus:dev -Dquarkus.roq.site.url=http://www.next-presso.com &
          DEV_PID=$!
          
          # Wait for the server to start
          echo "Waiting for Quarkus to start..."
          sleep 30
          
          # Check if the server is responding
          if curl -f http://localhost:8080/ > /dev/null 2>&1; then
            echo "Quarkus dev server started successfully"
            # Give it more time to generate all pages
            sleep 30
          else
            echo "Quarkus dev server failed to start properly"
          fi
          
          # Stop the dev server
          kill $DEV_PID || true
          wait $DEV_PID 2>/dev/null || true
          
          echo "Site generation completed"
      
      - name: Verify site structure
        run: |
          echo "Checking for generated files..."
          if [ -d "target/classes" ]; then
            echo "✓ Target classes directory exists"
            ls -la target/classes/
          else
            echo "✗ Target classes directory not found"
            exit 1
          fi
          
          echo "Build verification completed successfully!"
      
      - name: Comment on PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Build successful!** The Quarkus Roq site compiled successfully. Ready for review and merge.'
            })
